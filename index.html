<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Korean</title>
    <meta name="robots" content="noindex,follow">
    <meta http-equiv="refresh" content="0;url=/ko/index.html">
    <link rel="canonical" href="https://jonginchoi.com/ko/index.html">
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const force = params.get('lang');
            if (force === 'en') {
                localStorage.setItem('siteLang', 'en');
                window.location.replace('/en/index.html');
                return;
            }

            if (force === 'ko') {
                localStorage.setItem('siteLang', 'ko');
            }

            const preferredLang = localStorage.getItem('siteLang');
            if (preferredLang === 'en') {
                window.location.replace('/en/index.html');
                return;
            }

            window.location.replace('/ko/index.html');
        })();
    </script>
</head>

<body>
    <p>언어 설정이 적용되지 않았습니다. <a href="/ko/index.html">한국어로 이동</a> / <a href="/en/index.html">English</a></p>
</body>

</html>
